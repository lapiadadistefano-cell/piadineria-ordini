<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prova presa in carico comanda</title><style>body{font:18px system-ui,sans-serif;max-width:700px;margin:45px auto;padding:20px;color:#222}button{background:#146c43;color:#fff;border:0;border-radius:8px;padding:16px 22px;font-size:18px;cursor:pointer}button:disabled{opacity:.5}#result{margin-top:24px;padding:18px;border-radius:8px;background:#f1f4f5;white-space:pre-line;line-height:1.8}.warn{color:#965000}</style></head><body><h1>Prova presa in carico comanda</h1><p class="warn">AMBIENTE DI PROVA — Nessuna comanda viene inviata alla Rongta.</p><p>Due processi proveranno a prendere in carico contemporaneamente lo stesso ordine fittizio, salvato nel database Sandbox.</p><button id="go">Avvia prova database</button><div id="result" role="status" aria-live="polite">Pronto per il test.</div><script>const button=document.getElementById("go"),result=document.getElementById("result");button.addEventListener("click",async()=>{button.disabled=true;result.textContent="Controllo in corso...";try{const response=await fetch("/api/mypos/claim-simulation",{method:"POST"});const x=await response.json();if(!response.ok)throw Error(x.error||"Errore");const ok=x.simulationOnly===true&&x.attempts===2&&x.accepted===1&&x.rejected===1&&x.savedStatus==="printing"&&x.noPrinterConnected===true;result.textContent=ok?"TEST SUPERATO ✓\nRichieste contemporanee: 2\nPresa in carico accettata: 1\nSeconda richiesta bloccata: 1\nStato salvato nel database: printing\nNessuna stampa reale.":"ATTENZIONE: test non superato. Non attivare il servizio reale."}catch(e){result.textContent="Impossibile completare la prova: "+e.message}finally{button.disabled=false}});</script></body></html>
