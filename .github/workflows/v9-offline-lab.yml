name: V9 Offline PowerShell Lab
on:
  workflow_dispatch:
  push:
    branches: [test-mypos-sandbox]
    paths:
      - 'sandbox/v9-bridge-offline-lab.ps1'
      - '.github/workflows/v9-offline-lab.yml'
      - 'sandbox/v9-readonly-check.ps1'
      - 'sandbox/v9-readonly-check-offline-test.ps1'
      - 'sandbox/v9-windows-recovery-offline-test.ps1'
      - 'sandbox/v9-printer-offline-preflight.ps1'
      - 'sandbox/v9-printer-offline-safety-test.ps1'
jobs:
  offline-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated offline bridge decision simulation
        shell: pwsh
        run: |
          ./sandbox/v9-bridge-offline-lab.ps1
      - name: Test authorized read-only sandbox request with fake server
        shell: pwsh
        run: |
          ./sandbox/v9-readonly-check-offline-test.ps1
      - name: Test offline V9 Windows crash recovery and duplicate safety
        shell: pwsh
        run: |
          ./sandbox/v9-windows-recovery-offline-test.ps1

      - name: Validate printer preflight offline only
        shell: pwsh
        run: ./sandbox/v9-printer-offline-preflight.ps1 -LabOnly

      - name: Refuse real printer addresses and unsafe offline starts
        shell: pwsh
        run: ./sandbox/v9-printer-offline-safety-test.ps1
