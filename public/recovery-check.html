<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prova recupero stampa</title><style>body{font:18px system-ui,sans-serif;max-width:720px;margin:40px auto;padding:20px;color:#222}button{background:#146c43;color:white;border:0;border-radius:8px;padding:15px 22px;font-size:18px}button:disabled{opacity:.6}#result{margin-top:22px;background:#f1f4f5;border-radius:8px;padding:18px;white-space:pre-line;line-height:1.8}</style></head><body><h1>Prova recupero stampa</h1><p>Ambiente di prova: nessuna comanda verrà stampata.</p><p>Verifichiamo che una comanda interrotta venga salvata nel database e non sia ristampata automaticamente.</p><button id="go">Avvia prova recupero</button><div id="result" role="status" aria-live="polite">Pronto.</div><script>const b=document.getElementById("go"),r=document.getElementById("result");b.onclick=async()=>{b.disabled=true;r.textContent="Prova in corso...";try{const response=await fetch("/api/mypos/recovery-check",{method:"POST"}),x=await response.json();if(!response.ok)throw Error(x.error||"Errore");const pass=x.simulationOnly===true&&x.claimed===true&&x.needsReview===true&&x.savedStatus==="print_review_required"&&x.retryBlocked===true&&x.noPrinterConnected===true;r.textContent=pass?"TEST SUPERATO ✓\nComanda presa in carico: sì\nInterruzione simulata: sì\nStato salvato: verifica stampa necessaria\nRistampa automatica: bloccata\nNessuna stampa reale.":"ATTENZIONE: prova non superata. Non usare per ordini reali."}catch(e){r.textContent="Errore durante la prova: "+e.message}finally{b.disabled=false}};</script></body></html>
