name: V9 Lab CI (isolated)
on:
  push:
    branches: [test-mypos-sandbox]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: v9lab
          POSTGRES_PASSWORD: disposable-only
          POSTGRES_DB: v9lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U v9lab -d v9lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      V9_INTEGRATION_DATABASE_URL: postgres://v9lab:disposable-only@localhost:5432/v9lab
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
