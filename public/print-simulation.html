<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulazione stampa myPOS</title><style>body{font:18px system-ui,sans-serif;max-width:650px;margin:50px auto;padding:20px;color:#222}button{background:#146c43;color:white;border:0;border-radius:8px;padding:16px 24px;font-size:18px;cursor:pointer}button:disabled{opacity:.5}#result{margin-top:22px;padding:15px;border-radius:8px;background:#f2f4f5;white-space:pre-line}.warn{color:#9b4300}</style></head><body><h1>Simulazione stampa myPOS</h1><p class="warn">AMBIENTE DI PROVA — Nessuna comanda viene inviata alla stampante.</p><p>Il test crea un ordine fittizio nel database e prova a stamparlo due volte, senza utilizzare la Rongta.</p><button id="go">Simula stampa</button><div id="result" role="status" aria-live="polite">Pronto per il test.</div><script>const btn=document.getElementById("go"),result=document.getElementById("result");btn.addEventListener("click",async()=>{btn.disabled=true;result.textContent="Verifica in corso...";try{const response=await fetch("/api/mypos/print-simulation",{method:"POST"});const data=await response.json();if(!response.ok)throw Error(data.error||"Errore di simulazione");const passed=data.simulationOnly===true&&data.firstPrinted===true&&data.secondPrinted===false&&data.finalStatus==="printed"&&data.noPrinterConnected===true;result.textContent=passed?"TEST SUPERATO ✓\nPrima stampa: accettata\nSeconda stampa: bloccata\nNessuna comanda inviata alla Rongta.":"ATTENZIONE: test non superato. Non procedere con pagamenti reali."; }catch(e){result.textContent="Impossibile completare il test: "+e.message}finally{btn.disabled=false}});</script></body></html>
