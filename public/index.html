<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Piada di Stefano - Ordina e Ritira</title><style>:root{--r:#c81818;--g:#0d6b2d;--b:#f7f3ea}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--b);color:#1d1d1d}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:#111;color:#fff;padding:16px;position:sticky;top:0;z-index:20}.brand,.wrap{max-width:1000px;margin:auto}.brand{display:flex;justify-content:space-between;gap:10px;align-items:center}.brand h1{font-size:21px;margin:0}.brand small{opacity:.85}.wrap{padding:16px}.hero{background:#fff;border-radius:18px;padding:20px;margin-bottom:16px;border:1px solid #ddd}.hero h2{margin:0 0 8px;font-size:27px}.hours{font-weight:700;color:var(--g);line-height:1.45}.tabs{display:flex;gap:8px;overflow:auto;margin:16px 0;padding-bottom:3px}.tabs button{border:0;padding:11px 14px;border-radius:999px;background:#e7e1d7;font-weight:700;white-space:nowrap}.tabs button.active{background:var(--g);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.item{background:#fff;border-radius:14px;padding:14px;border:1px solid #ddd}.item h3{margin:0 0 6px}.ing{font-size:14px;min-height:36px;color:#555}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}.price{font-weight:800;color:var(--r);font-size:18px}.add,.submit{border:0;background:var(--g);color:#fff;border-radius:10px;padding:11px 14px;font-weight:700}.cartbar{position:sticky;bottom:0;background:#111;color:#fff;padding:12px 16px;display:flex;justify-content:center;z-index:30}.cartbar button{width:min(100%,960px);border:0;background:var(--r);color:#fff;border-radius:12px;padding:14px;font-size:17px;font-weight:800}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:50;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{background:#fff;width:min(100%,760px);max-height:92dvh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}.close{float:right;border:0;background:#eee;border-radius:9px;padding:9px 12px}.cartitem{border-bottom:1px solid #ddd;padding:12px 0}.qty{display:flex;gap:8px;align-items:center;margin-top:7px}.qty button{min-width:38px;min-height:38px}label{display:block;font-weight:700;margin-top:12px}input,select,textarea{width:100%;padding:12px;border:1px solid #aaa;border-radius:9px;font-size:16px}textarea{min-height:58px}.total{font-size:22px;font-weight:800;margin:16px 0}.submit{width:100%;padding:15px;font-size:17px}.submit:disabled{opacity:.55;cursor:not-allowed}.note{font-size:13px;color:#666;line-height:1.4}.success,.error,.special{padding:16px;border-radius:14px;font-weight:700;margin:16px 0}.special{background:#fff3cd;color:#6b4d00;border:1px solid #e4c75b}.success{background:#e8f6eb;color:#174d27}.error{background:#fdeaea;color:#7d1717}@media(max-width:520px){.brand{align-items:flex-start}.brand h1{font-size:18px}.brand>div:last-child{font-size:13px}.hero h2{font-size:23px}.wrap{padding:12px}.grid{grid-template-columns:1fr}.item{padding:13px}.cartbar{padding:10px 12px}}</style></head><body><header><div class="brand"><div><h1>LA PIADA DI STEFANO</h1><small>Via Dalmazia 77/c · 39100 Bolzano</small></div><div>Ordina e ritira</div></div></header><main class="wrap"><section class="hero"><h2>Ordina online e ritira senza attese</h2><div>Scegli, personalizza e indica l'orario di ritiro.</div><div id="specialNotice"></div><p class="hours">Lunedì–Sabato · 11:30–14:00 · 17:30–20:00<br>Ritiro con almeno 20 minuti di anticipo · Domenica chiuso</p></section><div id="result" aria-live="polite"></div><div class="tabs" id="tabs"></div><div class="grid" id="menu"></div></main><div class="cartbar"><button onclick="openCart()">Carrello · <span id="cartCount">0</span> prodotti · € <span id="cartTotal">0,00</span></button></div><div class="modal" id="modal"><div class="sheet"><button class="close" onclick="closeCart()">Chiudi</button><h2>Il tuo ordine</h2><div id="cartItems"></div><label for="customerName">Nome</label><input id="customerName" maxlength="80" autocomplete="name" placeholder="Il tuo nome"><label for="customerPhone">Telefono</label><input id="customerPhone" maxlength="40" inputmode="tel" autocomplete="tel" placeholder="Numero di telefono"><label for="pickup">Orario di ritiro</label><select id="pickup"></select><label for="notes">Note generali</label><textarea id="notes" maxlength="300" placeholder="Es. tutto ben cotto"></textarea><div class="total">Totale: € <span id="modalTotal">0,00</span></div><button id="submitBtn" class="submit" onclick="submitOrder()">Invia ordine</button><p class="note" id="pickupNote"></p></div></div><script>
let menu=[],cart=[],currentCat="",sending=false;const $=id=>document.getElementById(id),euro=n=>Number(n).toFixed(2).replace(".",",");
async function init(){const today=new Date();if(today.getFullYear()===2026&&today.getMonth()===8&&today.getDate()===21)$("specialNotice").innerHTML=`<div class="special">⚠️ Oggi Ordina e Ritira termina alle <b>13:45</b>.<br>Ultimo orario di ritiro disponibile: <b>13:40</b>.</div>`;try{menu=await fetch("/menu.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("Menu non disponibile");return r.json()});const cats=[...new Set(menu.map(x=>x.cat))];currentCat=cats[0];$("tabs").innerHTML=cats.map(c=>`<button data-c="${c}" onclick="setCat(this.dataset.c)">${c}</button>`).join("");renderMenu();renderPickup()}catch(e){showError("Non riusciamo a caricare il menu. Riprova tra poco.")}}
function showError(t){$("result").innerHTML=`<div class="error">${t}</div>`;window.scrollTo({top:0,behavior:"smooth"})}function setCat(c){currentCat=c;renderMenu()}function renderMenu(){document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.c===currentCat));$("menu").innerHTML=menu.filter(x=>x.cat===currentCat).map(x=>`<div class="item"><h3>${x.name}</h3><div class="ing">${x.ingredients}</div><div class="row"><span class="price">€ ${euro(x.price)}</span><button class="add" onclick="add(${menu.indexOf(x)})">+ Aggiungi</button></div></div>`).join("")}function add(i){const existing=cart.find(x=>x.name===menu[i].name&&!x.changes);if(existing&&existing.qty<20)existing.qty++;else cart.push({...menu[i],qty:1,changes:""});refreshCart()}function refreshCart(){const count=cart.reduce((s,x)=>s+x.qty,0),total=cart.reduce((s,x)=>s+x.qty*x.price,0);$("cartCount").textContent=count;$("cartTotal").textContent=euro(total)}function openCart(){renderPickup();renderCart();$("modal").classList.add("open")}function closeCart(){if(!sending)$("modal").classList.remove("open")}function renderCart(){$("cartItems").innerHTML=cart.length?cart.map((x,i)=>`<div class="cartitem"><b>${x.name}</b> · € ${euro(x.price)}<div class="qty"><button onclick="q(${i},-1)">−</button><b>${x.qty}</b><button onclick="q(${i},1)">+</button><button onclick="del(${i})">Elimina</button></div><textarea maxlength="200" placeholder="Modifiche: es. senza rucola" oninput="cart[${i}].changes=this.value">${x.changes||""}</textarea></div>`).join(""):"<p>Il carrello è vuoto.</p>";$("modalTotal").textContent=euro(cart.reduce((s,x)=>s+x.qty*x.price,0))}function q(i,d){cart[i].qty=Math.min(20,cart[i].qty+d);if(cart[i].qty<=0)cart.splice(i,1);refreshCart();renderCart()}function del(i){cart.splice(i,1);refreshCart();renderCart()}
function renderPickup(){const now=new Date(),day=now.getDay(),min=now.getHours()*60+now.getMinutes()+20,slots=[],specialToday=now.getFullYear()===2026&&now.getMonth()===8&&now.getDate()===21;if(day!==0)for(const[a,b]of(specialToday?[[690,820]]:[[690,840],[1050,1200]]))for(let t=a;t<=b;t+=10)if(t>=min)slots.push(`${String(Math.floor(t/60)).padStart(2,"0")}:${String(t%60).padStart(2,"0")}`);const p=$("pickup"),btn=$("submitBtn"),note=$("pickupNote");if(slots.length){p.disabled=false;p.innerHTML=slots.map(s=>`<option>${s}</option>`).join("");btn.disabled=sending;note.textContent="Gli orari mostrati rispettano i 20 minuti minimi di preparazione."}else{p.disabled=true;p.innerHTML="<option>Nessun orario disponibile oggi</option>";btn.disabled=true;note.textContent=day===0?"La domenica siamo chiusi. Gli ordini online riprendono lunedì.":"Non ci sono più orari di ritiro disponibili per oggi."}}
async function submitOrder(){if(sending)return;const result=$("result"),btn=$("submitBtn");result.innerHTML="";try{if(!cart.length)throw Error("Il carrello è vuoto");if($("pickup").disabled)throw Error("Nessun orario di ritiro disponibile oggi");const customer_name=$("customerName").value.trim(),phone=$("customerPhone").value.trim(),digits=phone.replace(/\D/g,"");if(customer_name.length<2)throw Error("Inserisci un nome valido");if(digits.length<6||digits.length>15)throw Error("Inserisci un numero di telefono valido");sending=true;btn.disabled=true;btn.textContent="Invio in corso...";const body={customer_name,phone,pickup_time:$("pickup").value,notes:$("notes").value.trim(),items:cart.map(x=>({qty:x.qty,name:x.name,changes:x.changes||""}))},r=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}),j=await r.json().catch(()=>null);if(!r.ok)throw Error(j?.error||"Errore del server");cart=[];refreshCart();$("customerName").value="";$("customerPhone").value="";$("notes").value="";$("modal").classList.remove("open");result.innerHTML=`<div class="success">✓ Ordine #${j.order.id} inviato correttamente!<br>Ritiro alle <b>${j.order.pickup_time}</b> · Totale € ${euro(j.order.total)}.<br>Grazie!</div>`;window.scrollTo({top:0,behavior:"smooth"})}catch(e){showError(e.message||"Impossibile inviare l'ordine. Riprova.")}finally{sending=false;btn.textContent="Invia ordine";renderPickup()}}
init();</script></body></html>
