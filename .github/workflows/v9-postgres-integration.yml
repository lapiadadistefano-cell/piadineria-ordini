name: V9 real PostgreSQL integration
on:
  push:
    branches: [test-mypos-sandbox]
    paths:
      - 'lib/sandbox-postgres.js'
      - 'lib/print-review.js'
      - 'test/v9-real-postgres.integration.test.js'
      - '.github/workflows/v9-postgres-integration.yml'
  workflow_dispatch:
jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: v9lab
          POSTGRES_PASSWORD: temporary-ci-only
          POSTGRES_DB: v9lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U v9lab -d v9lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Verify LAB-001 lifecycle against disposable real PostgreSQL
        env:
          V9_INTEGRATION_DATABASE_URL: postgresql://v9lab:temporary-ci-only@localhost:5432/v9lab
        run: node --test test/v9-real-postgres.integration.test.js
