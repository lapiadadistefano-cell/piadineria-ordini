<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulazione completa myPOS</title><style>body{font:18px system-ui,sans-serif;max-width:700px;margin:45px auto;padding:20px;color:#222}button{background:#146c43;color:#fff;border:0;border-radius:8px;padding:16px 22px;font-size:18px;cursor:pointer}button:disabled{opacity:.5}#result{margin-top:24px;padding:18px;border-radius:8px;background:#f1f4f5;white-space:pre-line;line-height:1.8}.warn{color:#965000}</style></head><body><h1>Simulazione completa myPOS</h1><p class="warn">AMBIENTE DI PROVA — Nessun pagamento reale e nessuna stampa.</p><p>Verifica l'intero percorso di un ordine, dalla conferma del pagamento al recupero di una stampa interrotta.</p><button id="go">Avvia simulazione completa</button><div id="result" role="status" aria-live="polite">Pronto per il test.</div><script>const button=document.getElementById("go"),result=document.getElementById("result");button.addEventListener("click",async()=>{button.disabled=true;result.textContent="Simulazione in corso...";try{const response=await fetch("/api/mypos/lifecycle-simulation",{method:"POST"});const x=await response.json();if(!response.ok)throw Error(x.error||"Errore");const ok=x.simulationOnly===true&&x.beforePayment===0&&x.afterPayment===1&&x.firstClaimAccepted===true&&x.competingClaimBlocked===true&&x.interruptionRequiresReview===true&&x.blockedDuringReview===true&&x.manualRetryAuthorized===true&&x.finalAcknowledged===true&&x.finalStatus==="printed"&&x.noDuplicateAfterCompletion===true&&x.noPrinterConnected===true;result.textContent=ok?"TEST COMPLETO SUPERATO ✓\nPagamento in attesa: stampa bloccata ✓\nPagamento confermato: comanda pronta ✓\nDoppia richiesta: bloccata ✓\nInterruzione: verifica richiesta ✓\nRecupero manuale: autorizzato ✓\nStampa simulata completata ✓\nNessuna comanda inviata alla Rongta ✓":"ATTENZIONE: verifica non superata. Non attivare il servizio reale."}catch(e){result.textContent="Test non completato: "+e.message}finally{button.disabled=false}});</script></body></html>
