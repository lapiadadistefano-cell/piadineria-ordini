<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>La Piada di Stefano - Amministrazione</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f5f5f1;color:#242424;font-family:Arial,Helvetica,sans-serif}
    main{max-width:520px;margin:50px auto;padding:22px}
    .panel{background:white;border-radius:18px;padding:30px;box-shadow:0 8px 30px #00000012}
    h1{margin:0 0 6px;font-size:28px}p{line-height:1.5}
    .sub{color:#666;margin:0 0 28px}.status{background:#f0f0f0;border-radius:10px;padding:15px;margin:20px 0}
    button{width:100%;padding:17px;margin:8px 0;border:0;border-radius:12px;font-size:17px;font-weight:bold;color:white;cursor:not-allowed;opacity:.65}
    .open{background:#237a3d}.close{background:#b63232}
    .note{font-size:13px;color:#666;margin-top:20px}
  </style>
</head>
<body>
  <main><section class="panel">
    <h1>La Piada di Stefano</h1>
    <p class="sub">Pannello amministratore</p>
    <div class="status"><strong>Stato ordini:</strong> <span>Non collegato</span></div>
    <button class="open" type="button" disabled>APRI ORDINI</button>
    <button class="close" type="button" disabled>CHIUDI ORDINI</button>
    <p class="note">Anteprima non operativa. Nessun comando viene inviato al sistema ordini. L'accesso protetto sarà aggiunto prima dell'attivazione.</p>
  </section></main>
</body>
</html>
